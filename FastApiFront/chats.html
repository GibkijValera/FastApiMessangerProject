<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Чаты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .chat-list-panel {
            width: 320px;
            background: #1e1e1e;
            border-right: 1px solid #3a3a3a;
            display: flex;
            flex-direction: column;
        }

        .chat-list-header {
            padding: 25px 20px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 20px;
            font-weight: 700;
            color: #ff8c00;
            text-align: center;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px 20px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            position: relative;
        }

        .chat-item:hover {
            background: #2a2a2a;
        }

        .chat-item.active {
            background: #2a2a2a;
            border-left: 3px solid #ff8c00;
            box-shadow: inset 0 0 10px rgba(255, 140, 0, 0.1);
        }

        .chat-item.has-unread {
            background: #1a1a1a;
        }

        .chat-item.has-unread .chat-name {
            color: #ff8c00;
            font-weight: 700;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .chat-name {
            font-weight: 600;
            color: #fff;
            font-size: 15px;
            flex: 1;
        }

        .chat-time {
            font-size: 11px;
            color: #666;
            margin-left: 10px;
        }

        .chat-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-last-message {
            font-size: 13px;
            color: #888;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-type {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .unread-badge {
            background: #ff8c00;
            color: white;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            padding: 0 6px;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #121212;
            position: relative;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 18px;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages.active {
            display: flex;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            line-height: 1.4;
            word-wrap: break-word;
            font-size: 14px;
        }

        .message.other {
            align-self: flex-start;
            background: #000000;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            border-bottom-left-radius: 4px;
        }

        .message.own {
            align-self: flex-end;
            background: #ff8c00;
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
        }

        .message-meta {
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.7;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #ff4444;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff8c00;
        }

        .chat-input-area {
            padding: 20px;
            background: #1e1e1e;
            border-top: 1px solid #3a3a3a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-upload-btn {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #ff8c00;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
        }

        .file-upload-btn:hover {
            background: #3a3a3a;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
        }

        .message-input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 20px;
            padding: 10px 15px;
            color: white;
            font-family: inherit;
            resize: none;
            height: 40px;
            outline: none;
        }

        .message-input:focus {
            border-color: #ff8c00;
        }

        .send-btn {
            background: #ff8c00;
            border: none;
            color: #1a1a1a;
            padding: 0 20px;
            height: 40px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .chat-input-area.editing .send-btn {
            background: #ff8c00;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .hidden { display: none; }

        .attachment-container {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .attachment-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
        }

        .attachment-img:hover {
            transform: scale(1.02);
        }

        .attachment-file-link {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.2s;
        }

        .attachment-file-link:hover {
            background: rgba(255, 140, 0, 0.2);
            border-color: #ff8c00;
        }

        .file-icon {
            font-size: 18px;
        }

        .context-menu {
            position: absolute;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 5px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none;
        }

        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            color: #fff;
            font-size: 13px;
            transition: background 0.2s;
        }

        .context-menu-item:hover {
            background: #ff8c00;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="chat-list-panel">
            <div class="chat-list-header">💬 Чаты</div>
            <div class="chat-list" id="chatList">
                <div class="loading">Загрузка...</div>
            </div>
        </div>

        <div class="chat-panel">
            <div class="chat-empty" id="emptyState">
                <span style="font-size: 40px;">💭</span>
                <span>Выберите чат для начала общения</span>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-area hidden" id="inputArea">
                <label for="fileInput" class="file-upload-btn" title="Прикрепить файл">+</label>
                <input type="file" id="fileInput" class="hidden" multiple>

                <textarea class="message-input" id="messageText" placeholder="Напишите сообщение..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">🚀 Отправить</button>
            </div>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" id="editMessageBtn">✏️ Редактировать</div>
        <div class="context-menu-item" id="deleteMessageBtn">🗑️ Удалить</div>
    </div>

    <script>
        let currentUserId = null;
        let currentChatId = null;
        let socket = null;
        let reconnectTimeout = null;
        const unreadCounts = {};

        async function init() {
            try {
                const response = await fetch('/users/me', { credentials: 'include' });
                if (response.status === 401) {
                    window.location.href = '/auth/login';
                    return;
                }
                const data = await response.json();
                currentUserId = data.user_id;

                connectWebSocket();
                await loadChats();
            } catch (error) {
                console.error('Init error:', error);
                window.location.href = '/auth/login';
            }
        }

        function connectWebSocket() {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }

            if (socket) {
                socket.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/`;

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log("✅ WebSocket connected");
            };

            socket.onmessage = (event) => {
                try {
                    const messageData = JSON.parse(event.data);
                    handleIncomingMessage(messageData);
                } catch (e) {
                    console.error('Error parsing WS message:', e);
                }
            };

            socket.onclose = (event) => {
                if (event.code === 4001) {
                    window.location.href = '/auth/login';
                    return;
                }
                reconnectTimeout = setTimeout(connectWebSocket, 3000);
            };

            socket.onerror = (error) => {
                console.error("WebSocket error:", error);
            };
        }

        function handleIncomingMessage(msg) {
            if (!msg.id || !msg.chat_id) return;

            const chatId = parseInt(msg.chat_id, 10);

            if (msg.action === 'delete') {
                removeMessageFromUI(msg.id);
                updateChatPreviewAfterDelete(chatId);
            } else if (msg.action === 'patch') {
                updateMessageInUI(msg);
                updateChatPreview(chatId, msg, msg.user_id === currentUserId);
            } else {
                const isOwnMessage = msg.user_id === currentUserId;
                updateChatPreview(chatId, msg, isOwnMessage);
                if (currentChatId && chatId === currentChatId) {
                    addMessageToUI(msg);
                }
            }
        }

        function removeMessageFromUI(messageId) {
            const messageEl = document.getElementById(`msg-${messageId}`);
            if (messageEl) {
                messageEl.remove();
            }
        }

        async function updateChatPreviewAfterDelete(chatId) {
            try {
                const response = await fetch(`/chats/${chatId}/messages?limit=1`, { credentials: 'include' });
                if (response.ok) {
                    const data = await response.json();
                    if (data.messages && data.messages.length > 0) {
                        const lastMsg = data.messages[0];
                        const chatElement = document.querySelector(`.chat-item[data-chat-id="${chatId}"]`);
                        if (chatElement) {
                            let previewText = lastMsg.text || '';
                            if (lastMsg.attachments && lastMsg.attachments.length > 0) {
                                if (previewText) previewText += ' ';
                                previewText += `📎 ${lastMsg.attachments.length} влож.`;
                            }
                            if (!previewText) previewText = 'Нет текста';
                            if (previewText.length > 50) previewText = previewText.substring(0, 47) + '...';
                            const isOwnMessage = lastMsg.user_id === currentUserId;
                            if (isOwnMessage) previewText = 'Вы: ' + previewText;

                            let timeStr = '';
                            try {
                                const dateObj = new Date(lastMsg.sent_at);
                                if (!isNaN(dateObj.getTime())) {
                                    timeStr = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                                }
                            } catch (e) {}

                            const lastMessageEl = chatElement.querySelector('.chat-last-message');
                            if (lastMessageEl) lastMessageEl.textContent = previewText;

                            const timeEl = chatElement.querySelector('.chat-time');
                            if (timeEl && timeStr) timeEl.textContent = timeStr;
                        }
                    } else {
                        const chatElement = document.querySelector(`.chat-item[data-chat-id="${chatId}"]`);
                        if (chatElement) {
                            const lastMessageEl = chatElement.querySelector('.chat-last-message');
                            if (lastMessageEl) lastMessageEl.textContent = 'Нет сообщений';
                            const timeEl = chatElement.querySelector('.chat-time');
                            if (timeEl) timeEl.textContent = '';
                        }
                    }
                }
            } catch (e) {
                console.error('Error updating chat preview after delete:', e);
            }
        }

        function updateMessageInUI(msg) {
            const messageEl = document.getElementById(`msg-${msg.id}`);
            if (!messageEl) return;

            let timeStr = "??:??";
            try {
                const dateObj = new Date(msg.time);
                if (!isNaN(dateObj.getTime())) {
                    timeStr = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                }
            } catch (e) {}

            let attachmentsHtml = '';
            if (msg.attachments && msg.attachments.length > 0) {
                attachmentsHtml = '<div class="attachment-container">';
                msg.attachments.forEach(att => {
                    const isImage = att.content_type && att.content_type.startsWith('image/');
                    const fileUrl = `/chats/${msg.chat_id}/messages/${msg.id}/attachments/${att.id}/view`;

                    if (isImage) {
                        attachmentsHtml += `<img src="${fileUrl}" class="attachment-img" onclick="window.open('${fileUrl}')">`;
                    } else {
                        attachmentsHtml += `
                            <a href="${fileUrl}" target="_blank" class="attachment-file-link">
                                <span class="file-icon">📎</span>
                                <span>${escapeHtml(att.filename)}</span>
                            </a>`;
                    }
                });
                attachmentsHtml += '</div>';
            }

            messageEl.innerHTML = `
                ${escapeHtml(msg.text || '')}
                ${attachmentsHtml}
                <div class="message-meta">${timeStr}</div>
            `;
        }

        function updateChatPreview(chatId, msg, isOwnMessage) {
            const chatElement = document.querySelector(`.chat-item[data-chat-id="${chatId}"]`);
            if (!chatElement) return;

            let previewText = msg.text || '';
            if (msg.attachments && msg.attachments.length > 0) {
                if (previewText) previewText += ' ';
                previewText += `📎 ${msg.attachments.length} влож.`;
            }

            if (!previewText) previewText = 'Нет текста';
            if (previewText.length > 50) previewText = previewText.substring(0, 47) + '...';
            if (isOwnMessage) previewText = 'Вы: ' + previewText;

            let timeStr = '';
            try {
                const dateObj = new Date(msg.time);
                if (!isNaN(dateObj.getTime())) {
                    timeStr = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                }
            } catch (e) {}

            const lastMessageEl = chatElement.querySelector('.chat-last-message');
            if (lastMessageEl) lastMessageEl.textContent = previewText;

            const timeEl = chatElement.querySelector('.chat-time');
            if (timeEl && timeStr) timeEl.textContent = timeStr;
            if (!isOwnMessage && currentChatId !== chatId) {
                if (!unreadCounts[chatId]) unreadCounts[chatId] = 0;
                unreadCounts[chatId]++;

                let badge = chatElement.querySelector('.unread-badge');
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'unread-badge';
                    const previewContainer = chatElement.querySelector('.chat-preview');
                    if (previewContainer) previewContainer.appendChild(badge);
                }
                badge.textContent = unreadCounts[chatId];
                chatElement.classList.add('has-unread');
            } else if (currentChatId === chatId) {
                const badge = chatElement.querySelector('.unread-badge');
                if (badge) badge.remove();
                chatElement.classList.remove('has-unread');
            }

            const chatList = document.getElementById('chatList');
            if (chatList && chatList.firstChild !== chatElement) {
                chatList.insertBefore(chatElement, chatList.firstChild);
            }
        }

        function addMessageToUI(msg) {
            const messagesPanel = document.getElementById('chatMessages');
            if (!messagesPanel) return;

            if (document.getElementById(`msg-${msg.id}`)) return;

            const messageEl = document.createElement('div');
            const isOwn = msg.user_id === currentUserId;
            messageEl.id = `msg-${msg.id}`;
            messageEl.className = `message ${isOwn ? 'own' : 'other'}`;

            let timeStr = "??:??";
            try {
                const dateObj = new Date(msg.time);
                if (!isNaN(dateObj.getTime())) {
                    timeStr = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                }
            } catch (e) {}

            let attachmentsHtml = '';
            if (msg.attachments && msg.attachments.length > 0) {
                attachmentsHtml = '<div class="attachment-container">';
                msg.attachments.forEach(att => {
                    const isImage = att.content_type && att.content_type.startsWith('image/');
                    const fileUrl = `/chats/${msg.chat_id}/messages/${msg.id}/attachments/${att.id}/view`;

                    if (isImage) {
                        attachmentsHtml += `<img src="${fileUrl}" class="attachment-img" onclick="window.open('${fileUrl}')">`;
                    } else {
                        attachmentsHtml += `
                            <a href="${fileUrl}" target="_blank" class="attachment-file-link">
                                <span class="file-icon">📎</span>
                                <span>${escapeHtml(att.filename)}</span>
                            </a>`;
                    }
                });
                attachmentsHtml += '</div>';
            }

            messageEl.innerHTML = `
                ${escapeHtml(msg.text || '')}
                ${attachmentsHtml}
                <div class="message-meta">${timeStr}</div>
            `;

            messagesPanel.appendChild(messageEl);
            messagesPanel.scrollTop = messagesPanel.scrollHeight;
        }

        async function loadChats() {
            const chatListEl = document.getElementById('chatList');

            try {
                const response = await fetch('/chats/load', { credentials: 'include' });
                if (response.status === 401) {
                    window.location.href = '/auth/login';
                    return;
                }

                const data = await response.json();
                if (!data.ok) {
                    chatListEl.innerHTML = '<div class="error">❌ Ошибка загрузки чатов</div>';
                    return;
                }

                chatListEl.innerHTML = '';

                if (data.chat_list.length === 0) {
                    chatListEl.innerHTML = '<div style="padding: 20px; color: #888; text-align: center;">Нет чатов 📭</div>';
                    return;
                }

                data.chat_list.forEach(chat => {
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    chatItem.dataset.chatId = chat.chat_id;

                    const typeIcon = chat.is_private ? '👤' : '👥';

                    let lastMsgText = "Нет сообщений";
                    let lastMsgTime = "";

                    if (chat.last_message) {
                        lastMsgText = chat.last_message.text || "📎 Вложение";
                        if (lastMsgText.length > 40) lastMsgText = lastMsgText.substring(0, 37) + "...";

                        if (chat.last_message.sent_at) {
                            const dateObj = new Date(chat.last_message.sent_at);
                            lastMsgTime = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                        }

                        if (chat.last_message.user_id === currentUserId) {
                            lastMsgText = "Вы: " + lastMsgText;
                        }
                    }

                    chatItem.innerHTML = `
                        <div class="chat-header">
                            <div class="chat-name">${typeIcon} ${chat.chat_name}</div>
                            <div class="chat-time">${lastMsgTime}</div>
                        </div>
                        <div class="chat-preview">
                            <div class="chat-last-message">${escapeHtml(lastMsgText)}</div>
                        </div>
                        <div class="chat-type">${chat.is_private ? 'Личный' : 'Групповой'}</div>
                    `;

                    chatItem.addEventListener('click', () => selectChat(parseInt(chat.chat_id, 10), chatItem));
                    chatListEl.appendChild(chatItem);
                });

            } catch (error) {
                console.error('Ошибка:', error);
                chatListEl.innerHTML = '<div class="error">❌ Ошибка подключения</div>';
            }
        }

        async function selectChat(chatId, chatElement) {
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            chatElement.classList.add('active');

            if (unreadCounts[chatId]) {
                delete unreadCounts[chatId];
                const badge = chatElement.querySelector('.unread-badge');
                if (badge) badge.remove();
                chatElement.classList.remove('has-unread');
            }

            currentChatId = chatId;

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('inputArea').classList.remove('hidden');
            const messagesPanel = document.getElementById('chatMessages');
            messagesPanel.classList.add('active');
            messagesPanel.innerHTML = '<div class="loading">Загрузка сообщений...</div>';

            await loadMessages(chatId);
        }

        async function loadMessages(chatId) {
            try {
                const response = await fetch(`/chats/${chatId}/messages?limit=50`, { credentials: 'include' });

                if (response.status === 401) {
                    window.location.href = '/auth/login';
                    return;
                }

                const data = await response.json();
                if (!data.ok || !data.messages) {
                    document.getElementById('chatMessages').innerHTML = '<div class="error">❌ Ошибка загрузки сообщений</div>';
                    return;
                }

                const messagesPanel = document.getElementById('chatMessages');
                messagesPanel.innerHTML = '';

                const sortedMessages = data.messages.sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at));

                sortedMessages.forEach(msg => {
                    const normalizedMsg = {
                        id: msg.message_id,
                        user_id: msg.user_id,
                        text: msg.text,
                        time: msg.sent_at,
                        chat_id: chatId,
                        attachments: msg.attachments || []
                    };
                    addMessageToUI(normalizedMsg);
                });

                messagesPanel.scrollTop = messagesPanel.scrollHeight;
            } catch (error) {
                console.error('Error loading messages:', error);
                document.getElementById('chatMessages').innerHTML = '<div class="error">❌ Ошибка загрузки сообщений</div>';
            }
        }

        async function sendMessage() {
            const textInput = document.getElementById('messageText');
            const fileInput = document.getElementById('fileInput');
            const text = textInput.value.trim();
            const files = fileInput.files;

            if (!text && files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const fileName = files[i].name;
                const ext = fileName.split('.').pop().toLowerCase();
                const blockedExts = ['exe', 'bat', 'cmd', 'sh', 'msi'];

                if (blockedExts.includes(ext)) {
                    alert(`❌ Файл ${fileName} запрещен к отправке`);
                    return;
                }
            }

            try {
                let response;
                if (isEditingMode && editingMessageId) {
                    const formData = new FormData();
                    formData.append('text', text);
                    for (let i = 0; i < files.length; i++) {
                        formData.append('files', files[i]);
                    }

                    response = await fetch(`/chats/${currentChatId}/messages/${editingMessageId}`, {
                        method: 'PATCH',
                        credentials: 'include',
                        body: formData
                    });

                    if (response.ok) {
                        isEditingMode = false;
                        editingMessageId = null;

                        const inputArea = document.getElementById('inputArea');
                        const sendBtn = document.getElementById('sendBtn');
                        inputArea.classList.remove('editing');
                        sendBtn.textContent = '🚀 Отправить';

                        textInput.value = '';
                        fileInput.value = '';
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        alert(`❌ Ошибка сохранения: ${errorData.detail || 'Неизвестная ошибка'}`);
                    }
                } else {
                    const formData = new FormData();
                    formData.append('text', text);
                    for (let i = 0; i < files.length; i++) {
                        formData.append('files', files[i]);
                    }

                    response = await fetch(`/chats/${currentChatId}/messages`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();

                        textInput.value = '';
                        fileInput.value = '';

                        const tempMessage = {
                            id: result.message_id,
                            user_id: currentUserId,
                            text: text,
                            time: new Date().toISOString(),
                            chat_id: currentChatId,
                            attachments: result.uploaded_files.map((fileId, index) => ({
                                id: fileId,
                                filename: files[index]?.name || 'file',
                                content_type: files[index]?.type || 'application/octet-stream'
                            }))
                        };

                        addMessageToUI(tempMessage);
                        updateChatPreview(currentChatId, tempMessage, true);
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        alert(`❌ Ошибка отправки: ${errorData.detail || 'Неизвестная ошибка'}`);
                    }
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('❌ Ошибка подключения');
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);

        document.getElementById('messageText').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        let selectedMessageId = null;
        const contextMenu = document.getElementById('contextMenu');
        const editMessageBtn = document.getElementById('editMessageBtn');
        const deleteMessageBtn = document.getElementById('deleteMessageBtn');
        let isEditingMode = false;
        let editingMessageId = null;
        document.getElementById('chatMessages').addEventListener('contextmenu', (e) => {
            const messageEl = e.target.closest('.message');
            if (!messageEl) return;

            e.preventDefault();
            if (!messageEl.classList.contains('own')) return;

            selectedMessageId = messageEl.id.replace('msg-', '');

            const rect = messageEl.getBoundingClientRect();
            const menuWidth = contextMenu.offsetWidth || 150;

            contextMenu.style.display = 'block';
            contextMenu.style.left = `${rect.left - menuWidth}px`;
            contextMenu.style.top = `${rect.top}px`;
        });

        document.addEventListener('click', () => {
            contextMenu.style.display = 'none';
        });

        editMessageBtn.addEventListener('click', async () => {
            if (!selectedMessageId || !currentChatId) return;

            const messageEl = document.getElementById(`msg-${selectedMessageId}`);
            if (!messageEl) return;

            const currentText = messageEl.childNodes[0]?.textContent?.trim() || '';
            const textInput = document.getElementById('messageText');
            textInput.value = currentText;
            textInput.focus();
            isEditingMode = true;
            editingMessageId = selectedMessageId;

            const inputArea = document.getElementById('inputArea');
            const sendBtn = document.getElementById('sendBtn');
            inputArea.classList.add('editing');
            sendBtn.textContent = '💾 Сохранить';

            contextMenu.style.display = 'none';
        });

        // Обработчик кнопки удаления сообщения
        deleteMessageBtn.addEventListener('click', async () => {
            if (!selectedMessageId || !currentChatId) return;

            if (!confirm('Вы уверены, что хотите удалить это сообщение?')) {
                return;
            }

            try {
                const response = await fetch(`/chats/${currentChatId}/messages/${selectedMessageId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    const messageEl = document.getElementById(`msg-${selectedMessageId}`);
                    if (messageEl) {
                        messageEl.remove();
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert(`❌ Ошибка удаления: ${errorData.detail || 'Неизвестная ошибка'}`);
                }
            } catch (error) {
                console.error('Ошибка удаления:', error);
                alert('❌ Ошибка подключения');
            }

            contextMenu.style.display = 'none';
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
